<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemma Prompt Tweaker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
            max-width: 800px;
            margin: auto;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }
        .header img {
            height: 80px;
            margin-right: 20px;
        }
        .header h1 {
            margin: 0;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 1em;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin-top: 10px;
            cursor: pointer;
        }
        .output-section {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        .output-column {
            width: 48%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .output-column h3 {
            margin-top: 0;
        }
        .makers {
            text-align: center;
            margin-top: 40px;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="/logo.png" alt="UvA logo">
        <h1>Gemma Prompt Tweaker</h1>
    </div>

    <label for="prompt">Enter your prompt:</label>
    <textarea id="prompt" placeholder="Type something..."></textarea>
    <button onclick="generateOutputs()">Generate</button>

    <div class="output-section">
        <div class="output-column" id="with-tweak">
            <h3>With Tweak</h3>
            <ul id="with-list"></ul>
        </div>
        <div class="output-column" id="without-tweak">
            <h3>Without Tweak</h3>
            <ul id="without-list"></ul>
        </div>
    </div>

    <div class="makers">
        Made by Faissal El Kayouhi, Aïda Asma, Jesse Wiers, Joey Laarhoven
    </div>

    <script>
        async function generateOutputs() {
            const prompt = document.getElementById('prompt').value;
            const withList = document.getElementById('with-list');
            const withoutList = document.getElementById('without-list');
            withList.innerHTML = '';
            withoutList.innerHTML = '';

            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });

            const data = await response.json();

            data.with_tweak.forEach(line => {
                const li = document.createElement('li');
                li.innerText = line;
                withList.appendChild(li);
            });

            data.without_tweak.forEach(line => {
                const li = document.createElement('li');
                li.innerText = line;
                withoutList.appendChild(li);
            });
        }
    </script>
</body>
</html>
